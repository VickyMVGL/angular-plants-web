<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tangram - Figura (Ajuste Final de Paralelogramo Rojo)</title>
    <style>
      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #f0f2f5;
        font-family: sans-serif;
      }
      canvas {
        background-color: #ffffff;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      h2 {
        color: #333;
        margin-bottom: 10px;
        font-weight: bold;
        color: #1a5276;
      }
      .message {
        margin-top: 20px;
        font-size: 1.2rem;
        color: #28b463;
        font-weight: 600;
        padding: 10px;
        border: 2px solid #28b463;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h2>Tanagrama 1 - FIgura 76</h2>
    <canvas id="miCanvas" width="600" height="500"></canvas>

    <script>
      const canvas = document.getElementById('miCanvas');
      const ctx = canvas.getContext('2d');

      // Configuración de la cuadrícula
      const escala = 80;
      // Ajuste de offset para centrar la figura
      const offsetX = 50;
      const offsetY = 50;

      // Constantes geométricas para las piezas del Tangram
      // mediumUnit = 1.414 (sqrt(2) approx) -> Cateto del triángulo mediano
      const mediumUnit = 1.414;
      // smallUnit = 1.0 -> Lado de los catetos pequeños
      const smallUnit = 1.0;
      const halfDiagonal = mediumUnit / 2; // 0.707

      // Función para dibujar cualquier polígono
      function dibujarFigura(puntos, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        // El primer punto inicia el camino
        ctx.moveTo(offsetX + puntos[0][0] * escala, offsetY + puntos[0][1] * escala);

        // Los siguientes puntos trazan las líneas
        for (let i = 1; i < puntos.length; i++) {
          ctx.lineTo(offsetX + puntos[i][0] * escala, offsetY + puntos[i][1] * escala);
        }

        ctx.closePath();
        ctx.fill();

        // Borde blanco para distinguir las piezas
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 3;
        ctx.stroke();
      }

      // --- PIEZA 1 (Morado - Triángulo Grande 2) ---
      // Muslo / Base
      const halfHypotenuse = mediumUnit;
      const height = mediumUnit;
      const baseCenterY = 4.0;
      const baseCenterX = 3.0;

      // Vértices del Morado
      const moradoV1X = baseCenterX - halfHypotenuse; // 1.586 (Esquina inferior izquierda)
      const moradoV1Y = baseCenterY; // 4.0
      const moradoV2X = baseCenterX + halfHypotenuse; // 4.414 (Esquina inferior derecha)
      const moradoV2Y = baseCenterY; // 4.0
      const moradoV3X = baseCenterX; // 3.0
      const moradoV3Y = baseCenterY - height; // 2.586 (Punta superior - Cintura)

      dibujarFigura(
        [
          [moradoV1X, moradoV1Y],
          [moradoV2X, moradoV2Y],
          [moradoV3X, moradoV3Y],
        ],
        '#8E44AD'
      );

      // --- PIEZA 2 (Azul - Triángulo Grande 1) ---
      // Torso

      // Vértices del Azul
      const azulV1X = moradoV2X; // 4.414
      const azulV1Y = moradoV2Y; // 4.0
      const azulV2X = moradoV3X; // 3.0
      const azulV2Y = moradoV3Y; // 2.586 (Cintura)
      const azulV3X = moradoV2X; // 4.414
      const azulV3Y = moradoV3Y - mediumUnit; // 1.172 (Hombro)

      dibujarFigura(
        [
          [azulV1X, azulV1Y],
          [azulV2X, azulV2Y],
          [azulV3X, azulV3Y],
        ],
        '#007BFF'
      );

      // --- PIEZA 3 (Amarillo Oro - Triángulo Pequeño 1) ---
      // Cabeza
      const Y_SHIFT_HEAD = -0.3;
      const headPivotX = azulV3X;
      const headPivotY = azulV3Y;

      // Vértices de la Cabeza
      const amarilloV2X = headPivotX; // 4.414
      const amarilloV2Y = headPivotY + Y_SHIFT_HEAD; // 0.872

      const amarilloV3X = headPivotX - mediumUnit; // 3.0
      const amarilloV3Y = headPivotY + Y_SHIFT_HEAD; // 0.872

      const amarilloV1X = (amarilloV2X + amarilloV3X) / 2; // 3.707
      const amarilloV1Y = headPivotY + Y_SHIFT_HEAD + halfDiagonal; // 1.579

      dibujarFigura(
        [
          [amarilloV2X, amarilloV2Y],
          [amarilloV3X, amarilloV3Y],
          [amarilloV1X, amarilloV1Y],
        ],
        '#F4D03F'
      );

      // --- PIEZA 4 (Naranja - Cuadrado) ---
      // Torso Superior / Cuello
      const naranjaV1X = 3.0;
      const naranjaV2X = 3.707;
      const naranjaV3X = 3.0;
      const naranjaV4X = 2.293;

      const naranjaV1Y = 0.872;
      const naranjaV2Y = 1.579;
      const naranjaV3Y = 2.286;
      const naranjaV4Y = 1.579;

      dibujarFigura(
        [
          [naranjaV1X, naranjaV1Y],
          [naranjaV2X, naranjaV2Y],
          [naranjaV3X, naranjaV3Y],
          [naranjaV4X, naranjaV4Y],
        ],
        '#FF9F1C'
      );

      // --- PIEZA 5 (Verde Esmeralda - Triángulo Pequeño 2) ---
      // Brazo Izquierdo

      const verdeV3X = naranjaV1X; // 3.0
      const verdeV3Y = naranjaV1Y; // 0.872

      const verdeV2X = naranjaV1X - mediumUnit; // 1.586
      const verdeV2Y = naranjaV1Y; // 0.872

      const verdeV1X = naranjaV4X; // 2.293
      const verdeV1Y = naranjaV4Y; // 1.579

      dibujarFigura(
        [
          [verdeV3X, verdeV3Y],
          [verdeV2X, verdeV2Y],
          [verdeV1X, verdeV1Y],
        ],
        '#2ECC71'
      );

      // --- PIEZA 6 (Rosa Fucsia - Triángulo Mediano) ---
      // Pierna Izquierda
      const shiftY = -1.1;

      // V2 (Punto Superior de la Hipotenusa)
      const rosaV2X = moradoV1X; // 1.586
      const rosaV2Y = moradoV1Y + shiftY; // 4.0 - 1.1 = 2.9

      // V3 (Punto Inferior de la Hipotenusa)
      const rosaV3X = rosaV2X; // 1.586
      const rosaV3Y = moradoV1Y - smallUnit * 2 + shiftY; // 4.0 - 2.0 - 1.1 = 0.9

      // V1 (Ángulo Recto - Apunta a la derecha)
      const rosaV1X = rosaV2X + smallUnit; // 1.586 + 1.0 = 2.586
      const rosaV1Y = moradoV1Y - smallUnit + shiftY; // 4.0 - 1.0 - 1.1 = 1.9

      dibujarFigura(
        [
          [rosaV1X, rosaV1Y], // (2.586, 1.9)
          [rosaV2X, rosaV2Y], // (1.586, 2.9)
          [rosaV3X, rosaV3Y], // (1.586, 0.9)
        ],
        '#FF1493'
      );

      // --- PIEZA 7 (Rojo - Paralelepípedo) ---
      // Se mueven V3 y V4 hacia arriba (eje Y) para corregir el desajuste.

      // V1 y V2 (Puntas superiores) se mantienen
      const rojoV1X = 2.6;
      const rojoV1Y = 1.9;

      const rojoV2X = 1.6;
      const rojoV2Y = 2.9;

      // V3 y V4 (Puntas inferiores) se mueven hacia arriba
      // (4.314 - 0.314) = 4.0
      // (3.314 - 0.314) = 3.0
      const rojoV3X = 1.6;
      const rojoV3Y = 4.0; // Ajustado hacia arriba

      const rojoV4X = 2.6;
      const rojoV4Y = 3.0; // Ajustado hacia arriba

      dibujarFigura(
        [
          [rojoV1X, rojoV1Y], // (2.6, 1.9) - Sin mover
          [rojoV2X, rojoV2Y], // (1.6, 2.9) - Sin mover
          [rojoV3X, rojoV3Y], // (1.6, 4.0) - Movido
          [rojoV4X, rojoV4Y], // (2.6, 3.0) - Movido
        ],
        '#FF6B6B'
      );
    </script>
  </body>
</html>
