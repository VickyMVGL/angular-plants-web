<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tanagramas</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      /* Definimos variables por defecto en caso de que styles.css 
         dependa de inyección en tiempo de ejecución, para evitar pantalla blanca.
      */
      :root {
        --color-primary-fallback: #ed6436;
        --color-secondary-fallback: #65c178;
        --color-text-1-fallback: #181818;
        --color-text-2-fallback: #777777;
        --color-bg-fallback: #ffffff;
      }

      body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        /* Usamos las variables del tema para el fondo. 
           Usamos un fallback en var() por si las variables principales no están definidas aún */
        background: linear-gradient(
          135deg,
          var(--color-bg, var(--color-bg-fallback)) 0%,
          var(--color-secondary, var(--color-secondary-fallback)) 100%
        );
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
      }

      .tanagram-title {
        position: absolute;
        top: 20px;
        left: 20px;
        /* Fondo basado en el BG del tema con ligera transparencia */
        background-color: var(--color-bg, var(--color-bg-fallback));
        padding: 12px 20px;
        border-radius: 8px;
        font-weight: bold;
        /* Texto usando el color primario */
        color: var(--color-primary, var(--color-primary-fallback));
        z-index: 10;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
        font-size: 1.2rem;
        opacity: 0.95;
      }

      canvas {
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      .progress-container {
        position: absolute;
        bottom: 20px;
        left: 20px;
        right: 20px;
        height: 8px;
        background-color: rgba(255, 255, 255, 0.3);
        border-radius: 4px;
        overflow: hidden;
      }

      .progress-bar {
        height: 100%;
        /* Gradiente usando Primary y Secondary */
        background: linear-gradient(
          to right,
          var(--color-primary, var(--color-primary-fallback)),
          var(--color-secondary, var(--color-secondary-fallback))
        );
        width: 25%;
        transition: width 0.5s ease;
      }

      .info {
        position: absolute;
        bottom: 40px;
        left: 20px;
        /* Usamos text-1 para la información, asumiendo que contrasta con el fondo */
        color: var(--color-text-1, var(--color-text-1-fallback));
        font-size: 0.9rem;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div class="tanagram-title" id="tanagramTitle">Tanagrama 1 - Figura 76</div>
    <canvas id="miCanvas"></canvas>
    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="info">Transiciones automáticas cada 1.2 segundos</div>

    <script>
      // ============================================
      // CONFIGURACIÓN INICIAL
      // ============================================
      const canvas = document.getElementById('miCanvas');
      const ctx = canvas.getContext('2d');
      const tanagramTitle = document.getElementById('tanagramTitle');
      const progressBar = document.getElementById('progressBar');

      // Estado
      let currentTanagram = 1;
      let totalTanagrams = 4;
      let isAnimating = false;
      const transitionSpeed = 1200; // ms
      let lastTransitionTime = 0;

      // Configuración de dibujo
      const escala = 90;
      let offsetX, offsetY;

      // Actualizar tamaño del canvas
      function actualizarTamanoCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Centrar las figuras manteniendo su tamaño
        offsetX = (canvas.width - 4.5 * escala) / 2;
        offsetY = (canvas.height - 5 * escala) / 2;
      }

      const mediumUnit = Math.sqrt(2); // ~1.414
      const smallUnit = 1.0;

      // ============================================
      // AYUDANTE DE COLORES (NUEVO)
      // ============================================

      // Función para obtener el valor hexadecimal/rgb de las variables CSS
      function getThemeColor(varName, fallback) {
        const style = getComputedStyle(document.documentElement);
        const value = style.getPropertyValue(varName).trim();
        return value && value !== '' ? value : fallback;
      }

      // ============================================
      // POSICIONES CORRECTAS DE LAS PIEZAS
      // ============================================

      function rotarPunto(x, y, cx, cy, angleDeg) {
        const angleRad = angleDeg * (Math.PI / 180);
        const cos = Math.cos(angleRad);
        const sin = Math.sin(angleRad);
        const tx = x - cx;
        const ty = y - cy;
        const rx = tx * cos - ty * sin;
        const ry = tx * sin + ty * cos;
        return [rx + cx, ry + cy];
      }

      // POSICIONES EXACTAS DE LOS TANAGRAMAS ORIGINALES
      const tanagramPositions = {
        // Tanagrama 1 - Figura 76
        1: {
          morado: [
            [1.586, 4.0],
            [4.414, 4.0],
            [3.0, 2.586],
          ],
          azul: [
            [4.414, 4.0],
            [3.0, 2.586],
            [4.414, 1.172],
          ],
          amarillo: [
            [4.414, 0.872],
            [3.0, 0.872],
            [3.707, 1.579],
          ],
          naranja: [
            [3.0, 0.872],
            [3.707, 1.579],
            [3.0, 2.286],
            [2.293, 1.579],
          ],
          verde: [
            [3.0, 0.872],
            [1.586, 0.872],
            [2.293, 1.579],
          ],
          rosa: [
            [2.586, 1.9],
            [1.586, 2.9],
            [1.586, 0.9],
          ],
          rojo: [
            [2.6, 1.9],
            [1.6, 2.9],
            [1.6, 4.0],
            [2.6, 3.0],
          ],
        },
        // Tanagrama 2 - Figura 143
        2: {
          morado: (() => {
            const [v1x, v1y] = rotarPunto(1.586, 4.0, 3.0, 2.586, 135);
            const [v2x, v2y] = rotarPunto(4.414, 4.0, 3.0, 2.586, 135);
            const v3x = 3.0,
              v3y = 2.586;
            const TX = 0.3,
              TY = 0.2;
            return [
              [v1x + TX, v1y + TY],
              [v2x + TX, v2y + TY],
              [v3x + TX, v3y + TY],
            ];
          })(),
          azul: (() => {
            const [v1x_r, v1y_r] = rotarPunto(4.414, 4.0, 3.0, 2.586, 45);
            const centerY = 2.586;
            const distY = v1y_r - centerY;
            const TX = 0.3,
              TY = 0.3;
            return [
              [3.0 + TX, centerY - distY + TY],
              [3.0 + TX, centerY + TY],
              [5.0 + TX, centerY + TY],
            ];
          })(),
          amarillo: (() => {
            const headPivotX = 4.414,
              headPivotY = 1.172;
            const Y_SHIFT = -0.3,
              DOWN_SHIFT = 2.1,
              X_SHIFT = -1.5;
            const v3x = headPivotX - mediumUnit + X_SHIFT;
            const v3y = headPivotY + Y_SHIFT + DOWN_SHIFT;
            const v1x = v3x + smallUnit,
              v1y = v3y;
            const v2x = v1x,
              v2y = v1y + smallUnit;
            return [
              [v2x, v2y],
              [v3x, v3y],
              [v1x, v1y],
            ];
          })(),
          naranja: (() => {
            const centroX = 3.0,
              centroY = 1.579;
            const [v1x, v1y] = rotarPunto(3.0, 0.872, centroX, centroY, 45);
            const [v2x, v2y] = rotarPunto(3.707, 1.579, centroX, centroY, 45);
            const [v3x, v3y] = rotarPunto(3.0, 2.286, centroX, centroY, 45);
            const [v4x, v4y] = rotarPunto(2.293, 1.579, centroX, centroY, 45);
            const TY = 1.9;
            return [
              [v1x, v1y + TY],
              [v2x, v2y + TY],
              [v3x, v3y + TY],
              [v4x, v4y + TY],
            ];
          })(),
          verde: (() => {
            const pivotX = 3.0,
              pivotY = 0.872;
            const [v2x, v2y] = rotarPunto(1.586, 0.872, pivotX, pivotY, 135);
            const [v1x, v1y] = rotarPunto(2.293, 1.579, pivotX, pivotY, 135);
            const TX = 0.5,
              TY = 3.1;
            return [
              [pivotX + TX, pivotY + TY],
              [v2x + TX, v2y + TY],
              [v1x + TX, v1y + TY],
            ];
          })(),
          rosa: (() => {
            const shiftY = -2.25,
              TX = 0.7,
              baseY = 4.0;
            return [
              [2.586 + TX, baseY - smallUnit + shiftY],
              [1.586 + TX, baseY + shiftY],
              [1.586 + TX, baseY - smallUnit * 2 + shiftY],
            ];
          })(),
          rojo: (() => {
            const centroX = 2.1,
              centroY = 2.95;
            const [v1x, v1y] = rotarPunto(2.6, 1.9, centroX, centroY, 90);
            const [v2x, v2y] = rotarPunto(1.6, 2.9, centroX, centroY, 90);
            const [v3x, v3y] = rotarPunto(1.6, 4.0, centroX, centroY, 90);
            const [v4x, v4y] = rotarPunto(2.6, 3.0, centroX, centroY, 90);
            const TX = -0.7,
              TY = 0.5;
            return [
              [v1x + TX, v1y + TY],
              [v2x + TX, v2y + TY],
              [v3x + TX, v3y + TY],
              [v4x + TX, v4y + TY],
            ];
          })(),
        },
        // Tanagrama 3 - Figura 28
        3: {
          amarillo: [
            [0, 2],
            [1, 2],
            [0, 3],
          ],
          rojo: [
            [1, 1],
            [2, 1],
            [1, 2],
            [0, 2],
          ],
          azul: [
            [0, 3],
            [2, 3],
            [2, 1],
          ],
          morado: [
            [2, 3],
            [4, 3],
            [2, 1],
          ],
          rosa: [
            [1, 3],
            [3, 3],
            [2, 4],
          ],
          verde: [
            [3, 3],
            [3, 4],
            [2, 4],
          ],
          naranja: [
            [3, 3],
            [4, 3],
            [4, 4],
            [3, 4],
          ],
        },
        // Tanagrama 4 - Figura 165
        4: {
          morado: (() => {
            const [v1x, v1y] = rotarPunto(1.586, 4.0, 3.0, 2.586, 135);
            const [v2x, v2y] = rotarPunto(4.414, 4.0, 3.0, 2.586, 135);
            const v3x = 3.0,
              v3y = 2.586;
            const TY = -1.2;
            return [
              [v1x, v1y + TY],
              [v2x, v2y + TY],
              [v3x, v3y + TY],
            ];
          })(),
          azul: (() => {
            const [v1x_r, v1y_r] = rotarPunto(4.414, 4.0, 3.0, 2.586, 45);
            const centerY = 2.586,
              distY = v1y_r - centerY,
              TY = -1.2;
            return [
              [3.0, centerY - distY + TY],
              [3.0, centerY + TY],
              [5.0, centerY + TY],
            ];
          })(),
          amarillo: (() => {
            const headPivotX = 4.414,
              headPivotY = 1.172;
            const Y_SHIFT = -0.3,
              DOWN_SHIFT = 1.95;
            const pivotX = headPivotX - mediumUnit;
            const pivotY = headPivotY + Y_SHIFT + DOWN_SHIFT;
            const [v1x, v1y] = rotarPunto(pivotX + smallUnit, pivotY, pivotX, pivotY, 45);
            const [v2x, v2y] = rotarPunto(
              pivotX + smallUnit,
              pivotY + smallUnit,
              pivotX,
              pivotY,
              45,
            );
            return [
              [v2x, v2y],
              [pivotX, pivotY],
              [v1x, v1y],
            ];
          })(),
          naranja: (() => {
            const centroX = 3.0,
              centroY = 1.579;
            const [v1x, v1y] = rotarPunto(3.0, 0.872, centroX, centroY, 90);
            const [v2x, v2y] = rotarPunto(3.707, 1.579, centroX, centroY, 90);
            const [v3x, v3y] = rotarPunto(3.0, 2.286, centroX, centroY, 90);
            const [v4x, v4y] = rotarPunto(2.293, 1.579, centroX, centroY, 90);
            const TY = 0.5;
            return [
              [v1x, v1y + TY],
              [v2x, v2y + TY],
              [v3x, v3y + TY],
              [v4x, v4y + TY],
            ];
          })(),
          verde: (() => {
            const pivotX = 3.0,
              pivotY = 0.872;
            const [v2x, v2y] = rotarPunto(1.586, 0.872, pivotX, pivotY, -270);
            const [v1x, v1y] = rotarPunto(2.293, 1.579, pivotX, pivotY, -270);
            const TY = 3.35;
            return [
              [pivotX, pivotY + TY],
              [v2x, v2y + TY],
              [v1x, v1y + TY],
            ];
          })(),
          rosa: (() => {
            const baseY = 4.0,
              TY_BASE = 3.25,
              TX = -0.1;
            const v1x_base = 2.586,
              v1y_base = baseY - smallUnit + TY_BASE;
            const [v2x_r, v2y_r] = rotarPunto(1.586, baseY + TY_BASE, v1x_base, v1y_base, 90);
            const [v3x_r, v3y_r] = rotarPunto(
              1.586,
              baseY - smallUnit * 2 + TY_BASE,
              v1x_base,
              v1y_base,
              90,
            );
            const reflectionY = v2y_r;
            const v1y_reflected = 2 * reflectionY - v1y_base;
            return [
              [v1x_base + TX, v1y_reflected],
              [v2x_r + TX, v2y_r],
              [v3x_r + TX, v3y_r],
            ];
          })(),
          rojo: (() => {
            const centroX = 2.1,
              centroY = 2.95;
            const [v1x, v1y] = rotarPunto(2.6, 1.9, centroX, centroY, 90);
            const [v2x, v2y] = rotarPunto(1.6, 2.9, centroX, centroY, 90);
            const [v3x, v3y] = rotarPunto(1.6, 4.0, centroX, centroY, 90);
            const [v4x, v4y] = rotarPunto(2.6, 3.0, centroX, centroY, 90);
            const TX = 1.5,
              TY = 1.8;
            return [
              [v1x + TX, v1y + TY],
              [v2x + TX, v2y + TY],
              [v3x + TX, v3y + TY],
              [v4x + TX, v4y + TY],
            ];
          })(),
        },
      };

      // Posiciones actuales de animación
      let currentPositions = JSON.parse(JSON.stringify(tanagramPositions[1]));
      let targetPositions = JSON.parse(JSON.stringify(tanagramPositions[1]));
      let animationProgress = 0;

      // ============================================
      // FUNCIONES DE DIBUJO Y ANIMACIÓN
      // ============================================

      function dibujarPieza(puntos, color, borderColor) {
        if (!puntos || puntos.length === 0) return;

        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(offsetX + puntos[0][0] * escala, offsetY + puntos[0][1] * escala);

        for (let i = 1; i < puntos.length; i++) {
          ctx.lineTo(offsetX + puntos[i][0] * escala, offsetY + puntos[i][1] * escala);
        }

        ctx.closePath();
        ctx.fill();

        // Borde usando el color de fondo para separar piezas
        ctx.strokeStyle = borderColor;
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      function limpiarCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }

      function dibujarTanagrama() {
        limpiarCanvas();

        // Obtener colores del tema actual
        // Definimos defaults por si el CSS no está cargado correctamente
        const cPrimary = getThemeColor('--color-primary', '#ed6436');
        const cSecondary = getThemeColor('--color-secondary', '#65c178');
        const cText1 = getThemeColor('--color-text-1', '#181818');
        const cText2 = getThemeColor('--color-text-2', '#777777');
        const cBg = getThemeColor('--color-bg', '#ffffff');

        // Mapeamos las piezas originales a la paleta del tema
        // Intentamos alternar colores para que piezas adyacentes no se confundan
        dibujarPieza(currentPositions.morado, cPrimary, cBg);
        dibujarPieza(currentPositions.azul, cSecondary, cBg);
        dibujarPieza(currentPositions.amarillo, cText1, cBg);
        dibujarPieza(currentPositions.naranja, cText2, cBg);
        dibujarPieza(currentPositions.verde, cPrimary, cBg);
        dibujarPieza(currentPositions.rosa, cSecondary, cBg);
        dibujarPieza(currentPositions.rojo, cText2, cBg);
      }

      function actualizarAnimacion(tiempoActual) {
        if (!lastTransitionTime) lastTransitionTime = tiempoActual;

        const deltaTime = tiempoActual - lastTransitionTime;
        lastTransitionTime = tiempoActual;

        if (isAnimating) {
          animationProgress += deltaTime / transitionSpeed;

          if (animationProgress >= 1) {
            animationProgress = 1;
            isAnimating = false;
            setTimeout(iniciarSiguienteTransicion, 300);
          } else {
            const t = animationProgress;
            const smoothT = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

            const piezas = ['morado', 'azul', 'amarillo', 'naranja', 'verde', 'rosa', 'rojo'];
            for (const pieza of piezas) {
              if (
                currentPositions[pieza] &&
                targetPositions[pieza] &&
                currentPositions[pieza].length === targetPositions[pieza].length
              ) {
                for (let i = 0; i < currentPositions[pieza].length; i++) {
                  const startX = currentPositions[pieza][i][0];
                  const targetX = targetPositions[pieza][i][0];
                  currentPositions[pieza][i][0] = startX + (targetX - startX) * smoothT;

                  const startY = currentPositions[pieza][i][1];
                  const targetY = targetPositions[pieza][i][1];
                  currentPositions[pieza][i][1] = startY + (targetY - startY) * smoothT;
                }
              }
            }
          }
        }

        dibujarTanagrama();
        requestAnimationFrame(actualizarAnimacion);
      }

      // ============================================
      // CONTROL DE TRANSICIONES
      // ============================================

      function actualizarInterfaz() {
        const titulos = [
          'Tanagrama 1 - Figura 76',
          'Tanagrama 2 - Figura 143',
          'Tanagrama 3 - Figura 28',
          'Tanagrama 4 - Figura 165',
        ];

        tanagramTitle.textContent = titulos[currentTanagram - 1];
        progressBar.style.width = `${(currentTanagram / totalTanagrams) * 100}%`;
      }

      function iniciarTransicion() {
        if (isAnimating) return;
        targetPositions = JSON.parse(JSON.stringify(tanagramPositions[currentTanagram]));
        animationProgress = 0;
        isAnimating = true;
        actualizarInterfaz();
      }

      function iniciarSiguienteTransicion() {
        currentTanagram = currentTanagram < totalTanagrams ? currentTanagram + 1 : 1;
        iniciarTransicion();
      }

      // ============================================
      // INICIALIZACIÓN Y EVENTOS
      // ============================================

      function inicializar() {
        actualizarTamanoCanvas();

        window.addEventListener('resize', () => {
          actualizarTamanoCanvas();
          dibujarTanagrama();
        });

        actualizarInterfaz();
        iniciarTransicion();

        setInterval(() => {
          if (!isAnimating) {
            iniciarSiguienteTransicion();
          }
        }, transitionSpeed + 300);

        requestAnimationFrame(actualizarAnimacion);
      }

      window.addEventListener('load', inicializar);
    </script>
  </body>
</html>
